      - **Endpoint:** `POST /wc/v3/products/categories/batch`
      - **What you need to provide:** A list of product categories to create and a list of product categories to update. Each entry accepts the same fields as the single-product category operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated product categories, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

      ## Product tags

      ### List product tags

      Lists the WooCommerce product tags on the site.

      - **Endpoint:** `GET /wc/v3/products/tags`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, exclude, include, hide empty or product. Use page and per page to work through a long list.
      - **What you get back:** A list of product tags, each with fields such as ID, name, slug and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

