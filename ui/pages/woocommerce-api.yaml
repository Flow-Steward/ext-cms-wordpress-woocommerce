      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of payment gateways, each with fields such as ID, title, description and order, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads payment gateways only; it does not change them.

      ### Get a payment gateway

      Returns the full record for one WooCommerce payment gateway, found by its payment gateway ID.

      - **Endpoint:** `GET /wc/v3/payment_gateways/{id}`
      - **What you need to provide:** The payment gateway ID.
      - **What you get back:** The payment gateway, including ID, title, description, order and enabled.
      - **Important:** This version reads payment gateways only; it does not change them.

      ### Update a payment gateway

      Changes the data of one existing WooCommerce payment gateway.

      - **Endpoint:** `PUT /wc/v3/payment_gateways/{id}`
