      ## Product custom field names

      ### List custom field names

      Lists the WooCommerce custom field names on the site.

      - **Endpoint:** `GET /wc/v3/products/custom-fields/names`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of custom field names, each with fields such as value, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads custom field names only; it does not change them.

      ## Product reviews

      ### List product reviews

      Lists the WooCommerce product reviews on the site.

      - **Endpoint:** `GET /wc/v3/products/reviews`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, before, dates are gmt or exclude. Use page and per page to work through a long list.
