      ## Shipping classes

      ### List shipping classes

      Lists the WooCommerce shipping classes on the site.

      - **Endpoint:** `GET /wc/v3/products/shipping_classes`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, exclude, include, hide empty or product. Use page and per page to work through a long list.
      - **What you get back:** A list of shipping classes, each with fields such as ID, name, slug and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

