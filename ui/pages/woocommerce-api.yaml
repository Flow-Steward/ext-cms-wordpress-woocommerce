  - component_id: woocommerce_api_shipping
    type: markdown
    title: Shipping
    body: |
      ## Shipping zones

      ### List shipping zones

      Lists the WooCommerce shipping zones on the site.

      - **Endpoint:** `GET /wc/v3/shipping/zones`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of shipping zones, each with fields such as ID, name and order, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Create a shipping zone

      Creates a new WooCommerce shipping zone.

      - **Endpoint:** `POST /wc/v3/shipping/zones`
      - **What you need to provide:** The fields for the new shipping zone. Name must be supplied. You can also set order.
      - **What you get back:** The created shipping zone, including the ID the site assigned to it.

      ### Get a shipping zone

      Returns the full record for one WooCommerce shipping zone, found by its zone ID.

      - **Endpoint:** `GET /wc/v3/shipping/zones/{id}`
      - **What you need to provide:** The zone ID.
      - **What you get back:** The shipping zone, including ID, name and order.

      ### Update a shipping zone

      Changes the data of one existing WooCommerce shipping zone.

      - **Endpoint:** `PUT /wc/v3/shipping/zones/{id}`
      - **What you need to provide:** The zone ID, plus only the fields that should change, such as name or order. Anything you leave out keeps its current value.
      - **What you get back:** The updated shipping zone with its current values.

      ## Shipping zone locations

      ### List shipping zone locations

      Lists the WooCommerce shipping zone locations on the site.

      - **Endpoint:** `GET /wc/v3/shipping/zones/{id}/locations`
      - **What you need to provide:** The zone ID to list shipping zone locations for.
      - **What you get back:** A list of shipping zone locations, each with fields such as type and code, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Update a shipping zone location

      Changes the data of one existing WooCommerce shipping zone location.

      - **Endpoint:** `PUT /wc/v3/shipping/zones/{id}/locations`
      - **What you need to provide:** The zone ID, plus only the fields that should change, such as code or type. Anything you leave out keeps its current value.
      - **What you get back:** The updated shipping zone location with its current values.

      ## Shipping zone methods

      ### List shipping zone methods

      Lists the WooCommerce shipping zone methods on the site.

      - **Endpoint:** `GET /wc/v3/shipping/zones/{zone_id}/methods`
      - **What you need to provide:** The shipping zone ID to list shipping zone methods for.
      - **What you get back:** A list of shipping zone methods, each with fields such as title, instance id, order and enabled, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Create a shipping zone method

      Creates a new WooCommerce shipping zone method.

      - **Endpoint:** `POST /wc/v3/shipping/zones/{zone_id}/methods`
      - **What you need to provide:** The shipping zone ID it belongs to, plus the fields for the new shipping zone method. Method id must be supplied. You can also set order, enabled or settings.
      - **What you get back:** The created shipping zone method, including the ID the site assigned to it.

      ### Get a shipping zone method

      Returns the full record for one WooCommerce shipping zone method, found by its shipping zone ID and method ID.

      - **Endpoint:** `GET /wc/v3/shipping/zones/{zone_id}/methods/{id}`
      - **What you need to provide:** The shipping zone ID and method ID.
      - **What you get back:** The shipping zone method, including title, instance id, order, enabled and method id.

      ### Update a shipping zone method

      Changes the data of one existing WooCommerce shipping zone method.

      - **Endpoint:** `PUT /wc/v3/shipping/zones/{zone_id}/methods/{id}`
      - **What you need to provide:** The shipping zone ID and method ID, plus only the fields that should change, such as order, enabled or settings. Anything you leave out keeps its current value.
      - **What you get back:** The updated shipping zone method with its current values.

      ## Shipping methods

      ### List shipping methods

      Lists the WooCommerce shipping methods on the site.

      - **Endpoint:** `GET /wc/v3/shipping_methods`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of shipping methods, each with fields such as ID, title and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads shipping methods only; it does not change them.

      ### Get a shipping method

      Returns the full record for one WooCommerce shipping method, found by its shipping method ID.

      - **Endpoint:** `GET /wc/v3/shipping_methods/{id}`
      - **What you need to provide:** The shipping method ID.
      - **What you get back:** The shipping method, including ID, title and description.
      - **Important:** This version reads shipping methods only; it does not change them.

  - component_id: woocommerce_api_store_configuration
    type: markdown
    title: Store configuration
    body: |
      ## Setting groups

      ### List site settings

      Lists the WooCommerce site settings on the site.

      - **Endpoint:** `GET /wc/v3/settings`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of site settings, each with fields such as ID, description, label and parent id, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ## Individual settings

      ### List settings

      Lists the WooCommerce settings on the site.

      - **Endpoint:** `GET /wc/v3/settings/{group_id}`
      - **What you need to provide:** The settings group to list settings for.
      - **What you get back:** A list of settings, each with fields such as ID, type, description and label, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Get a setting

