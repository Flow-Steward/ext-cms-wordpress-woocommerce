  - component_id: woocommerce_api_orders
    type: markdown
    title: Orders
    body: |
      ## Orders

      ### List orders

      Lists the WooCommerce orders on the site.

      - **Endpoint:** `GET /wc/v3/orders`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, before, modified after or modified before. Use page and per page to work through a long list.
      - **What you get back:** A list of orders, each with fields such as ID, status, total and currency, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create an order

      Creates a new WooCommerce order.

      - **Endpoint:** `POST /wc/v3/orders`
      - **What you need to provide:** The fields for the new order. You can also set parent id, created via, status or currency.
      - **What you get back:** The created order, including the ID the site assigned to it.

      ### Get an order

      Returns the full record for one WooCommerce order, found by its order ID.

      - **Endpoint:** `GET /wc/v3/orders/{id}`
      - **What you need to provide:** The order ID. You can also set dp.
      - **What you get back:** The order, including ID, status, total, currency and number.

      ### Update an order

      Changes the data of one existing WooCommerce order.

      - **Endpoint:** `PUT /wc/v3/orders/{id}`
      - **What you need to provide:** The order ID, plus only the fields that should change, such as parent id, created via, status or currency. Anything you leave out keeps its current value.
      - **What you get back:** The updated order with its current values.

      ### Create or update several orders

      Creates and updates several WooCommerce orders in one request.

      - **Endpoint:** `POST /wc/v3/orders/batch`
      - **What you need to provide:** A list of orders to create and a list of orders to update. Each entry accepts the same fields as the single-order operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated orders, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

      ## Order notes

      ### List order notes

      Lists the WooCommerce order notes on the site.

      - **Endpoint:** `GET /wc/v3/orders/{id}/notes`
      - **What you need to provide:** The order ID to list order notes for. You can narrow the result by type.
      - **What you get back:** A list of order notes, each with fields such as ID, date created, author and GMT creation date, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Create an order note

      Creates a new WooCommerce order note.

      - **Endpoint:** `POST /wc/v3/orders/{id}/notes`
      - **What you need to provide:** The order ID it belongs to, plus the fields for the new order note. Note must be supplied. You can also set customer note or added by user.
      - **What you get back:** The created order note, including the ID the site assigned to it.

      ### Get an order note

      Returns the full record for one WooCommerce order note, found by its order ID and note ID.

      - **Endpoint:** `GET /wc/v3/orders/{id}/notes/{note_id}`
      - **What you need to provide:** The order ID and note ID.
      - **What you get back:** The order note, including ID, date created, author, GMT creation date and note.

      ## Order actions

      ### List the emails available for an order

      Lists the order emails WooCommerce can currently send for one order.

      - **Endpoint:** `GET /wc/v3/orders/{id}/actions/email_templates`
      - **What you need to provide:** The order ID.
      - **What you get back:** A list of the email templates available for that order, each with its ID and name.
      - **Important:** Which templates are available depends on the order's current status. This returns the whole set in one response and does not page.

      ### Email order details to the customer

      Sends the customer the order details email for one order.

      - **Endpoint:** `POST /wc/v3/orders/{id}/actions/send_order_details`
      - **What you need to provide:** The order ID.
      - **What you get back:** A confirmation message from WooCommerce.
      - **Important:** This sends a real email to the customer.

      ### Send an order email to the customer

      Sends the customer a chosen WooCommerce order email, such as the completed-order or refunded-order notification.

      - **Endpoint:** `POST /wc/v3/orders/{id}/actions/send_email`
      - **What you need to provide:** The order ID and the email template to send. You can also send it to a different address and update the billing email at the same time.
      - **What you get back:** A confirmation message from WooCommerce.
      - **Important:** This sends a real email to the customer. Only templates that are valid for that order's current status are accepted.

      ## Order refunds

      ### List the refunds on one order

      Lists the WooCommerce refunds on the site.

      - **Endpoint:** `GET /wc/v3/orders/{id}/refunds`
      - **What you need to provide:** The order ID to list refunds for. You can narrow the result by search, after, before, dates are gmt or exclude. Use page and per page to work through a long list.
      - **What you get back:** A list of refunds, each with fields such as ID, date created, GMT creation date and amount, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Get a refund

      Returns the full record for one WooCommerce refund, found by its order ID and refund ID.

      - **Endpoint:** `GET /wc/v3/orders/{id}/refunds/{refund_id}`
      - **What you need to provide:** The order ID and refund ID. You can also set dp.
      - **What you get back:** The refund, including ID, date created, GMT creation date, amount and reason.

      ### Preview a refund

      Calculates what a refund for an order would come to, without creating it.

      - **Endpoint:** `POST /wc/v3/orders/{id}/refunds/preview`
      - **What you need to provide:** The order ID and the lines to preview. Each line names the order line it refers to, how many units, and optionally an explicit amount for that line.
      - **What you get back:** The totals the refund would come to - a breakdown by products, shipping and fees, the subtotal, the tax, the total, and how much of the order is still refundable.
      - **Important:** This only calculates. No refund is created, and creating, changing or deleting refunds is not available in this version. The endpoint needs WooCommerce 11.1 or newer; on an older store it does not exist and the site answers with a not-found error. Note that a preview line is keyed by the order's line item ID, which the create-a-refund endpoint calls id.

      ## All refunds

      ### List refunds

      Lists the WooCommerce refunds on the site.

      - **Endpoint:** `GET /wc/v3/refunds`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of refunds, each with fields such as parent id, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads refunds only; it does not change them.

