      - **What you get back:** The setting, including ID, type, description, label and value.

      ### Update a setting

      Changes the data of one existing WooCommerce setting.

      - **Endpoint:** `PUT /wc/v3/settings/{group_id}/{id}`
      - **What you need to provide:** The settings group and setting ID, plus only the fields that should change, such as value. Anything you leave out keeps its current value.
      - **What you get back:** The updated setting with its current values.

      ### Create or update several settings

      Creates and updates several WooCommerce settings in one request.

      - **Endpoint:** `POST /wc/v3/settings/{group_id}/batch`
      - **What you need to provide:** A list of settings to create and a list of settings to update. Each entry accepts the same fields as the single-setting operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated settings, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

      ## Payment gateways

