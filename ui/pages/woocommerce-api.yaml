      - **What you get back:** The updated payment gateway with its current values.

  - component_id: woocommerce_api_reports_and_store_data
    type: markdown
    title: Reports and store data
    body: |
      ## Reports

      ### List the available reports

      Lists which WooCommerce reports this store can produce.

      - **Endpoint:** `GET /wc/v3/reports`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of the available reports, each with its slug and description.
      - **Important:** This is the index of reports, not the figures themselves. It returns the whole set in one response and does not page.

      ### Get the sales report

      Returns gross and net sales, order and item counts, discounts, shipping and taxes for a period.

      - **Endpoint:** `GET /wc/v3/reports/sales`
      - **What you need to provide:** Nothing is required. Choose the period with period, or set an exact range with date min and date max.
      - **What you get back:** A list with the sales figures for the period, including total sales, net sales, average sales, order count, item count, refunds, discounts, shipping and taxes.
      - **Important:** This returns the whole set in one response and does not page.

      ### Get the top sellers report

      Returns the best-selling products for a period, with how many of each were sold.

      - **Endpoint:** `GET /wc/v3/reports/top_sellers`
      - **What you need to provide:** Nothing is required. Choose the period with period, or set an exact range with date min and date max.
      - **What you get back:** A list of the top-selling products, each with its product ID, name and quantity sold.
      - **Important:** This returns the whole set in one response and does not page.

      ### Count coupons by type

      Returns how many coupons the store has of each discount type.

      - **Endpoint:** `GET /wc/v3/reports/coupons/totals`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of coupon types, each with its name and how many coupons use it.
      - **Important:** This returns the whole set in one response and does not page.

      ### Count customers by type

      Returns how many customers the store has, split into paying and non-paying.

      - **Endpoint:** `GET /wc/v3/reports/customers/totals`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of customer types, each with its name and how many customers it covers.
      - **Important:** This returns the whole set in one response and does not page.

      ### Count orders by status

      Returns how many orders the store has in each order status.

      - **Endpoint:** `GET /wc/v3/reports/orders/totals`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of order statuses, each with its name and how many orders are in it.
      - **Important:** This returns the whole set in one response and does not page.

      ### Count products by type

      Returns how many products the store has of each product type, such as simple or variable.

      - **Endpoint:** `GET /wc/v3/reports/products/totals`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of product types, each with its name and how many products use it.
      - **Important:** This returns the whole set in one response and does not page.

      ### Count reviews by status

      Returns how many product reviews the store has in each moderation status.

      - **Endpoint:** `GET /wc/v3/reports/reviews/totals`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of review statuses, each with its name and how many reviews are in it.
      - **Important:** This returns the whole set in one response and does not page.

      ## System status reports

      ### Get the store's system status

      Returns WooCommerce's own diagnostic report about the store environment.

      - **Endpoint:** `GET /wc/v3/system_status`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The environment, database, active theme, settings and security sections of the WooCommerce status report.
      - **Important:** Read only. Running system status tools is not available in this version.

      ## System status tools

      ### List system status tools

      Lists the WooCommerce system status tools on the site.

      - **Endpoint:** `GET /wc/v3/system_status/tools`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of system status tools, each with fields such as ID, name, description and action, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads system status tools only; it does not change them.

      ### Get a system status tool

      Returns the full record for one WooCommerce system status tool, found by its tool ID.

      - **Endpoint:** `GET /wc/v3/system_status/tools/{id}`
      - **What you need to provide:** The tool ID.
      - **What you get back:** The system status tool, including ID, name, description and action.
      - **Important:** This version reads system status tools only; it does not change them.

      ## Store data

      ### List the available store data

      Lists which reference data sets WooCommerce can return, such as countries and currencies.

      - **Endpoint:** `GET /wc/v3/data`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of the available data sets, each with its slug and description.
      - **Important:** This returns the whole set in one response and does not page.

      ### List continents

      Returns every continent WooCommerce knows about, with the countries in each.

      - **Endpoint:** `GET /wc/v3/data/continents`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of continents, each with its code, name and the countries it contains.
      - **Important:** This is WooCommerce's built-in reference data, not your store's settings, and it returns the whole set in one response.

      ### Get one continent

      Returns one continent and the countries it contains.

      - **Endpoint:** `GET /wc/v3/data/continents/{location}`
      - **What you need to provide:** The continent code, such as eu or na.
      - **What you get back:** The continent with its code, name and countries, including each country's states and currency.

      ### List countries

      Returns every country WooCommerce knows about, with its states or provinces.

      - **Endpoint:** `GET /wc/v3/data/countries`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of countries, each with its two-letter code, name and states.
      - **Important:** This is WooCommerce's built-in reference data, not your store's settings, and it returns the whole set in one response.

      ### Get one country

      Returns one country and its states or provinces.

      - **Endpoint:** `GET /wc/v3/data/countries/{location}`
      - **What you need to provide:** The two-letter country code, such as US or DE.
      - **What you get back:** The country with its code, name and the list of its states.

      ### List currencies

      Returns every currency WooCommerce knows about, with its symbol.

      - **Endpoint:** `GET /wc/v3/data/currencies`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** A list of currencies, each with its three-letter code, name and symbol.
      - **Important:** This is WooCommerce's built-in reference data, not your store's settings, and it returns the whole set in one response.

      ### Get one currency

      Returns one currency and its symbol.

      - **Endpoint:** `GET /wc/v3/data/currencies/{currency}`
      - **What you need to provide:** The three-letter currency code, such as USD or EUR.
      - **What you get back:** The currency with its code, name and symbol.

      ### Get the store's currency

      Returns the currency this store is currently selling in.

      - **Endpoint:** `GET /wc/v3/data/currencies/current`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The store's currency with its code, name and symbol.

  - component_id: woocommerce_api_unavailable
    type: markdown
    title: Not available in this version
    body: |
      These are excluded by design, not missing by accident. The technical inventory with one row per route is in `contracts/rest_coverage.yaml`.

      ### Adding or changing WooCommerce webhooks

      A WooCommerce webhook decides where the store sends its data, so this extension does not create or change one on your behalf. Add a webhook trigger to a workflow, then paste the address it gives you into WooCommerce yourself; the Setup Guide walks through it.

      Affects: `GET /wc/v3/webhooks`, `POST /wc/v3/webhooks`, `GET /wc/v3/webhooks/{id}`, `PUT /wc/v3/webhooks/{id}`, `POST /wc/v3/webhooks/batch`.

      ### Deleting records

      Deleting is unavailable in version 1.0.0 because this extension excludes destructive operations. Read, create and update the record instead, or delete it in the site's admin.

      Affects: `DELETE /wc/v3/coupons/{id}`, `DELETE /wc/v3/customers/{id}`, `DELETE /wc/v3/orders/{id}`, `DELETE /wc/v3/orders/{id}/notes/{note_id}`, `DELETE /wc/v3/products/{id}`, `DELETE /wc/v3/products/{product_id}/variations/{id}`, `DELETE /wc/v3/products/attributes/{id}`, `DELETE /wc/v3/products/attributes/{attribute_id}/terms/{id}`, `DELETE /wc/v3/products/categories/{id}`, `DELETE /wc/v3/products/shipping_classes/{id}`, `DELETE /wc/v3/products/tags/{id}`, `DELETE /wc/v3/products/reviews/{id}`, `DELETE /wc/v3/taxes/{id}`, `DELETE /wc/v3/taxes/classes/{slug}`, `DELETE /wc/v3/webhooks/{id}`, `DELETE /wc/v3/shipping/zones/{id}`, `DELETE /wc/v3/shipping/zones/{zone_id}/methods/{id}`.

      ### Creating or changing refunds

      Creating, changing and deleting refunds is unavailable in version 1.0.0 because a refund moves money. Refunds can be read, and a refund can be previewed without creating it.

      Affects: `POST /wc/v3/orders/{id}/refunds`, `DELETE /wc/v3/orders/{id}/refunds/{refund_id}`.

      ### Running system status tools

      Running a system status tool is unavailable because those tools change store data. The list of tools and the status report itself can be read.

      Affects: `PUT /wc/v3/system_status/tools/{id}`.

      ### Deleting through a batch request

      A batch request can create and update records, never delete them. The delete member of the native batch payload is not accepted.

      Affects: `POST /wc/v3/<resource>/batch#delete`.
