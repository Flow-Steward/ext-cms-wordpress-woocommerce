      - **What you need to provide:** The customer ID, plus only the fields that should change, such as email, first name, last name or username. Anything you leave out keeps its current value.
      - **What you get back:** The updated customer with its current values.

      ### Create or update several customers

      Creates and updates several WooCommerce customers in one request.

      - **Endpoint:** `POST /wc/v3/customers/batch`
      - **What you need to provide:** A list of customers to create and a list of customers to update. Each entry accepts the same fields as the single-customer operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated customers, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

      ### List a customer's downloads

      Lists the downloadable files one customer currently has access to.

      - **Endpoint:** `GET /wc/v3/customers/{id}/downloads`
      - **What you need to provide:** The customer ID.
      - **What you get back:** A list of the downloads available to that customer, each with its file name, product and remaining downloads.
      - **Important:** This returns the whole set in one response and does not page.

  - component_id: woocommerce_api_coupons
    type: markdown
    title: Coupons
    body: |
      ## Coupons

      ### List coupons

      Lists the WooCommerce coupons on the site.

      - **Endpoint:** `GET /wc/v3/coupons`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, before, modified after or modified before. Use page and per page to work through a long list.
      - **What you get back:** A list of coupons, each with fields such as ID, date created, description and code, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a coupon

      Creates a new WooCommerce coupon.

      - **Endpoint:** `POST /wc/v3/coupons`
      - **What you need to provide:** The fields for the new coupon. Code must be supplied. You can also set amount, discount type, description or individual use.
      - **What you get back:** The created coupon, including the ID the site assigned to it.

      ### Get a coupon

      Returns the full record for one WooCommerce coupon, found by its coupon ID.

      - **Endpoint:** `GET /wc/v3/coupons/{id}`
      - **What you need to provide:** The coupon ID.
      - **What you get back:** The coupon, including ID, date created, description, code and amount.

      ### Update a coupon

      Changes the data of one existing WooCommerce coupon.

      - **Endpoint:** `PUT /wc/v3/coupons/{id}`
      - **What you need to provide:** The coupon ID, plus only the fields that should change, such as code, amount, discount type or description. Anything you leave out keeps its current value.
      - **What you get back:** The updated coupon with its current values.

      ### Create or update several coupons

      Creates and updates several WooCommerce coupons in one request.

      - **Endpoint:** `POST /wc/v3/coupons/batch`
      - **What you need to provide:** A list of coupons to create and a list of coupons to update. Each entry accepts the same fields as the single-coupon operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated coupons, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

