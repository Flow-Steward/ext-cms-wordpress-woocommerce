page_id: woocommerce-api
title: WooCommerce API
description: What this extension can do with your WooCommerce store, and what each operation needs.
components:
  - component_id: woocommerce_api_overview
    type: markdown
    title: 114 operations available
    body: |
      Every operation below is fixed in advance and typed against the official WooCommerce REST API v3 reference. Nothing is discovered from your store, and there is no general-purpose request action.

      Endpoints are shown relative to your site URL. These operations need the WooCommerce Consumer Key and Consumer Secret on the connection.

      [Official WooCommerce API reference](https://developer.woocommerce.com/docs/apis/rest-api/v3/)
  - component_id: woocommerce_api_products
    type: markdown
    title: Products
    body: |
      ## Products

      ### List products

      Lists the WooCommerce products on the site.

      - **Endpoint:** `GET /wc/v3/products`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, search fields, after, before or modified after. Use page and per page to work through a long list.
      - **What you get back:** A list of products, each with fields such as ID, name, slug and status, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a product

      Creates a new WooCommerce product.

      - **Endpoint:** `POST /wc/v3/products`
      - **What you need to provide:** The fields for the new product. You can also set name, type, status or featured.
      - **What you get back:** The created product, including the ID the site assigned to it.

      ### Get a product

      Returns the full record for one WooCommerce product, found by its product ID.

      - **Endpoint:** `GET /wc/v3/products/{id}`
      - **What you need to provide:** The product ID.
      - **What you get back:** The product, including ID, name, slug, status and type.

      ### Update a product

      Changes the data of one existing WooCommerce product, including its price and stock level.

      - **Endpoint:** `PUT /wc/v3/products/{id}`
      - **What you need to provide:** The product ID and only the fields that should change, such as regular price, sale price, stock quantity, stock status, name, description or status. Anything you leave out keeps its current value.
      - **What you get back:** The updated product with its current values.
      - **Important:** This changes the product itself. A variable product's prices and stock live on its variations, which are updated through the variation operations.

      ### Create or update several products

      Creates and updates many WooCommerce products in one request, which is the efficient way to push a price or stock update for a whole catalogue.

      - **Endpoint:** `POST /wc/v3/products/batch`
      - **What you need to provide:** A list of products to create and a list of products to update. Each update entry needs the product ID plus the fields that change, such as regular price, sale price or stock quantity.
      - **What you get back:** The created and updated products, grouped under create and update the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version. WooCommerce accepts at most 100 items per request.

      ### Duplicate a product

      Creates a copy of an existing product.

      - **Endpoint:** `POST /wc/v3/products/{product_id}/duplicate`
      - **What you need to provide:** The ID of the product to copy.
      - **What you get back:** The newly created copy, including its new ID.
      - **Important:** The copy is created as a draft, following WooCommerce's own behaviour.

      ## Product variations

      ### List product variations

      Lists the WooCommerce product variations on the site.

      - **Endpoint:** `GET /wc/v3/products/{product_id}/variations`
      - **What you need to provide:** The product ID to list product variations for. You can narrow the result by search, after, before, dates are gmt or exclude. Use page and per page to work through a long list.
      - **What you get back:** A list of product variations, each with fields such as ID, status, public link and price, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a product variation

      Creates a new WooCommerce product variation.

      - **Endpoint:** `POST /wc/v3/products/{product_id}/variations`
      - **What you need to provide:** The product ID it belongs to, plus the fields for the new product variation. You can also set description, SKU, global unique id or regular price.
      - **What you get back:** The created product variation, including the ID the site assigned to it.
      - **Important:** Variations belong to one product and are managed separately from it.

      ### Get a product variation

      Returns the full record for one WooCommerce product variation, found by its product ID and variation ID.

      - **Endpoint:** `GET /wc/v3/products/{product_id}/variations/{id}`
      - **What you need to provide:** The product ID and variation ID.
      - **What you get back:** The product variation, including ID, status, public link, price and regular price.

      ### Update a product variation

      Changes one variation of a variable product, including its own price and stock level.

      - **Endpoint:** `PUT /wc/v3/products/{product_id}/variations/{id}`
      - **What you need to provide:** The product ID and variation ID, plus only the fields that should change, such as regular price, sale price, stock quantity or stock status. Anything you leave out keeps its current value.
      - **What you get back:** The updated variation with its current values.
      - **Important:** A variation carries its own price and stock, separate from the parent product.

      ### Create or update several product variations

      Creates and updates many variations of one product in a single request, for bulk price or stock changes.

      - **Endpoint:** `POST /wc/v3/products/{product_id}/variations/batch`
      - **What you need to provide:** The product ID, plus a list of variations to create and a list to update. Each update entry needs the variation ID and the fields that change, such as regular price or stock quantity.
      - **What you get back:** The created and updated variations, grouped under create and update.
      - **Important:** Deleting through a batch is not available in this version. WooCommerce accepts at most 100 items per request.

      ## Product attributes

      ### List product attributes

      Lists the WooCommerce product attributes on the site.

      - **Endpoint:** `GET /wc/v3/products/attributes`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of product attributes, each with fields such as ID, name, slug and type, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Create a product attribute

      Creates a new WooCommerce product attribute.

      - **Endpoint:** `POST /wc/v3/products/attributes`
      - **What you need to provide:** The fields for the new product attribute. Name must be supplied. You can also set type, order by or has archives.
      - **What you get back:** The created product attribute, including the ID the site assigned to it.

      ### Get a product attribute

      Returns the full record for one WooCommerce product attribute, found by its attribute ID.

      - **Endpoint:** `GET /wc/v3/products/attributes/{id}`
      - **What you need to provide:** The attribute ID.
      - **What you get back:** The product attribute, including ID, name, slug, type and order by.

      ### Update a product attribute

      Changes the data of one existing WooCommerce product attribute.

      - **Endpoint:** `PUT /wc/v3/products/attributes/{id}`
      - **What you need to provide:** The attribute ID, plus only the fields that should change, such as name, type, order by or has archives. Anything you leave out keeps its current value.
      - **What you get back:** The updated product attribute with its current values.

      ### Create or update several product attributes

      Creates and updates several WooCommerce product attributes in one request.

      - **Endpoint:** `POST /wc/v3/products/attributes/batch`
      - **What you need to provide:** A list of product attributes to create and a list of product attributes to update. Each entry accepts the same fields as the single-product attribute operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated product attributes, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

      ## Attribute terms

      ### List attribute terms

      Lists the WooCommerce attribute terms on the site.

      - **Endpoint:** `GET /wc/v3/products/attributes/{attribute_id}/terms`
      - **What you need to provide:** The attribute ID to list attribute terms for. You can narrow the result by search, exclude, include, hide empty or parent. Use page and per page to work through a long list.
      - **What you get back:** A list of attribute terms, each with fields such as ID, name, slug and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create an attribute term

      Creates a new WooCommerce attribute term.

      - **Endpoint:** `POST /wc/v3/products/attributes/{attribute_id}/terms`
      - **What you need to provide:** The attribute ID it belongs to, plus the fields for the new attribute term. Name must be supplied. You can also set description or menu order.
      - **What you get back:** The created attribute term, including the ID the site assigned to it.

      ### Get an attribute term

      Returns the full record for one WooCommerce attribute term, found by its attribute ID and term ID.

      - **Endpoint:** `GET /wc/v3/products/attributes/{attribute_id}/terms/{id}`
      - **What you need to provide:** The attribute ID and term ID.
      - **What you get back:** The attribute term, including ID, name, slug, description and count.

      ### Update an attribute term

      Changes the data of one existing WooCommerce attribute term.

      - **Endpoint:** `PUT /wc/v3/products/attributes/{attribute_id}/terms/{id}`
      - **What you need to provide:** The attribute ID and term ID, plus only the fields that should change, such as name, description or menu order. Anything you leave out keeps its current value.
      - **What you get back:** The updated attribute term with its current values.

      ### Create or update several attribute terms

      Creates and updates several WooCommerce attribute terms in one request.

      - **Endpoint:** `POST /wc/v3/products/attributes/{attribute_id}/terms/batch`
      - **What you need to provide:** A list of attribute terms to create and a list of attribute terms to update. Each entry accepts the same fields as the single-attribute term operations, and every update entry needs the ID of the record it changes.
      - **What you get back:** The created and updated attribute terms, grouped the way WooCommerce returns them.
      - **Important:** Deleting through a batch is not available in this version.

