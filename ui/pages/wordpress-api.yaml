title: WordPress API
description: What this extension can do with WordPress, and what each operation needs.
components:
  - component_id: wordpress_api_overview
    type: markdown
    title: 78 operations available
    body: |
      Every operation below is fixed in advance and typed against the official WordPress REST reference. Nothing is discovered from your site, so a custom post type, a custom taxonomy, a custom route or a plugin field never appears here, and there is no general-purpose request action.

      Endpoints are shown relative to your site URL.

      [Official WordPress API reference](https://developer.wordpress.org/rest-api/reference/)
  - component_id: wordpress_api_content
    type: markdown
    title: Content
    body: |
      ## Posts

      ### List posts

      Lists the WordPress posts on the site.

      - **Endpoint:** `GET /wp/v2/posts`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, modified after, author or author exclude. Use page and per page to work through a long list.
      - **What you get back:** A list of posts, each with fields such as ID, title, slug and status, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a post

      Creates a new WordPress post.

      - **Endpoint:** `POST /wp/v2/posts`
      - **What you need to provide:** The fields for the new post. You can also set date, status, title or content.
      - **What you get back:** The created post, including the ID the site assigned to it.

      ### Get a post

      Returns the full record for one WordPress post, found by its post ID.

      - **Endpoint:** `GET /wp/v2/posts/{id}`
      - **What you need to provide:** The post ID.
      - **What you get back:** The post, including ID, title, slug, status and type.

      ### Update a post

      Changes the data of one existing WordPress post.

      - **Endpoint:** `POST /wp/v2/posts/{id}`
      - **What you need to provide:** The post ID, plus only the fields that should change, such as date, status, title or content. Anything you leave out keeps its current value.
      - **What you get back:** The updated post with its current values.

      ## Post revisions and autosaves

      ### List post revisions

      Lists the WordPress post revisions on the site.

      - **Endpoint:** `GET /wp/v2/posts/{parent}/revisions`
      - **What you need to provide:** The post ID to list post revisions for. You can narrow the result by search, exclude or include. Use page and per page to work through a long list.
      - **What you get back:** A list of post revisions, each with fields such as ID, title, slug and date, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Get a post revision

      Returns the full record for one WordPress post revision, found by its post ID and revision ID.

      - **Endpoint:** `GET /wp/v2/posts/{parent}/revisions/{id}`
      - **What you need to provide:** The post ID and revision ID.
      - **What you get back:** The post revision, including ID, title, slug, date and author.

      ### List post autosaves

      Lists the autosaves WordPress has stored for one post. An autosave is the editor's in-progress draft, separate from a saved revision.

      - **Endpoint:** `GET /wp/v2/posts/{id}/autosaves`
      - **What you need to provide:** The post ID.
      - **What you get back:** A list of autosaves for that post, each with its ID, author, date and content.
      - **Important:** This returns the whole set in one response and does not page.

      ### Create a post autosave

      Stores an autosave for one post, the way the block editor does while somebody is typing.

      - **Endpoint:** `POST /wp/v2/posts/{id}/autosaves`
      - **What you need to provide:** The post ID and the fields to autosave, such as title, content or excerpt.
      - **What you get back:** The created autosave, including the ID WordPress assigned to it.
      - **Important:** An autosave does not change the published post.

      ### Get a post autosave

      Returns one stored autosave for a post.

      - **Endpoint:** `GET /wp/v2/posts/{parent}/autosaves/{id}`
      - **What you need to provide:** The post ID and autosave ID.
      - **What you get back:** The autosave, including its author, date, title and content.

      ## Pages

      ### List pages

      Lists the WordPress pages on the site.

      - **Endpoint:** `GET /wp/v2/pages`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, modified after, author or author exclude. Use page and per page to work through a long list.
      - **What you get back:** A list of pages, each with fields such as ID, title, slug and status, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a page

      Creates a new WordPress page.

      - **Endpoint:** `POST /wp/v2/pages`
      - **What you need to provide:** The fields for the new page. You can also set date, status, parent or title.
      - **What you get back:** The created page, including the ID the site assigned to it.

      ### Get a page

      Returns the full record for one WordPress page, found by its page ID.

      - **Endpoint:** `GET /wp/v2/pages/{id}`
      - **What you need to provide:** The page ID.
      - **What you get back:** The page, including ID, title, slug, status and type.

      ### Update a page

      Changes the data of one existing WordPress page.

      - **Endpoint:** `POST /wp/v2/pages/{id}`
      - **What you need to provide:** The page ID, plus only the fields that should change, such as date, status, parent or title. Anything you leave out keeps its current value.
      - **What you get back:** The updated page with its current values.

      ## Page revisions and autosaves

      ### List page revisions

      Lists the WordPress page revisions on the site.

      - **Endpoint:** `GET /wp/v2/pages/{parent}/revisions`
      - **What you need to provide:** The page ID to list page revisions for. You can narrow the result by search, exclude or include. Use page and per page to work through a long list.
      - **What you get back:** A list of page revisions, each with fields such as ID, title, slug and date, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Get a page revision

      Returns the full record for one WordPress page revision, found by its page ID and revision ID.

      - **Endpoint:** `GET /wp/v2/pages/{parent}/revisions/{id}`
      - **What you need to provide:** The page ID and revision ID.
      - **What you get back:** The page revision, including ID, title, slug, date and author.

      ### List page autosaves

      Lists the autosaves WordPress has stored for one page. An autosave is the editor's in-progress draft, separate from a saved revision.

      - **Endpoint:** `GET /wp/v2/pages/{id}/autosaves`
      - **What you need to provide:** The page ID.
      - **What you get back:** A list of autosaves for that page, each with its ID, author, date and content.
      - **Important:** This returns the whole set in one response and does not page.

      ### Create a page autosave

      Stores an autosave for one page, the way the block editor does while somebody is typing.

      - **Endpoint:** `POST /wp/v2/pages/{id}/autosaves`
      - **What you need to provide:** The page ID and the fields to autosave, such as title, content or excerpt.
      - **What you get back:** The created autosave, including the ID WordPress assigned to it.
      - **Important:** An autosave does not change the published page.

      ### Get a page autosave

      Returns one stored autosave for a page.

      - **Endpoint:** `GET /wp/v2/pages/{parent}/autosaves/{id}`
      - **What you need to provide:** The page ID and autosave ID.
      - **What you get back:** The autosave, including its author, date, title and content.

      ## Media items

      ### List media items

      Lists the WordPress media items on the site.

      - **Endpoint:** `GET /wp/v2/media`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, modified after, author or author exclude. Use page and per page to work through a long list.
      - **What you get back:** A list of media items, each with fields such as ID, title, slug and status, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Upload a media file

      Uploads a file to the WordPress media library.

      - **Endpoint:** `POST /wp/v2/media`
      - **What you need to provide:** A file from an earlier workflow step, the file name to store it under, and optionally details such as the title, alt text, caption or description.
      - **What you get back:** The created media item, including its ID and the public URL of the uploaded file.
      - **Important:** The file is sent exactly as supplied. Nothing is resized, converted, compressed or optimised.

      ### Get a media item

      Returns the full record for one WordPress media item, found by its media ID.

      - **Endpoint:** `GET /wp/v2/media/{id}`
      - **What you need to provide:** The media ID.
      - **What you get back:** The media item, including ID, title, slug, status and type.

      ### Update a media item

      Changes the data of one existing WordPress media item.

      - **Endpoint:** `POST /wp/v2/media/{id}`
      - **What you need to provide:** The media ID, plus only the fields that should change, such as date, status, title or author. Anything you leave out keeps its current value.
      - **What you get back:** The updated media item with its current values.

      ## Comments

      ### List comments

      Lists the WordPress comments on the site.

      - **Endpoint:** `GET /wp/v2/comments`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, author, author exclude or author email. Use page and per page to work through a long list.
      - **What you get back:** A list of comments, each with fields such as ID, status, type and link, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a comment

      Creates a new WordPress comment.

      - **Endpoint:** `POST /wp/v2/comments`
      - **What you need to provide:** The fields for the new comment. You can also set author, author email, author ip or author name.
      - **What you get back:** The created comment, including the ID the site assigned to it.

      ### Get a comment

      Returns the full record for one WordPress comment, found by its comment ID.

      - **Endpoint:** `GET /wp/v2/comments/{id}`
      - **What you need to provide:** The comment ID.
      - **What you get back:** The comment, including ID, status, type, link and date.

      ### Update a comment

      Changes one existing WordPress comment, including moderating it.

      - **Endpoint:** `POST /wp/v2/comments/{id}`
      - **What you need to provide:** The comment ID and the fields to change; anything you leave out keeps its current value. Setting the status is how you moderate: approved publishes it, hold sends it back to the moderation queue, spam marks it as spam, and trash moves it to the site's trash.
      - **What you get back:** The updated comment, including its new status.
      - **Important:** This is the one place in this extension where something can be moved to trash, and it is deliberate: marking a comment as spam or trashing it is what moderation means. Nothing is deleted outright - a trashed comment stays in the site's trash until somebody empties it there. No other operation accepts trash as a status.

  - component_id: wordpress_api_categories_and_tags
    type: markdown
    title: Categories and tags
    body: |
      ## Categories

      ### List categories

      Lists the WordPress categories on the site.

      - **Endpoint:** `GET /wp/v2/categories`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, exclude, include, hide empty or parent. Use page and per page to work through a long list.
      - **What you get back:** A list of categories, each with fields such as ID, name, slug and link, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a category

      Creates a new WordPress category.

      - **Endpoint:** `POST /wp/v2/categories`
      - **What you need to provide:** The fields for the new category. Name must be supplied. You can also set description or parent.
      - **What you get back:** The created category, including the ID the site assigned to it.

      ### Get a category

      Returns the full record for one WordPress category, found by its category ID.

      - **Endpoint:** `GET /wp/v2/categories/{id}`
      - **What you need to provide:** The category ID.
      - **What you get back:** The category, including ID, name, slug, link and description.

      ### Update a category

      Changes the data of one existing WordPress category.

      - **Endpoint:** `POST /wp/v2/categories/{id}`
      - **What you need to provide:** The category ID, plus only the fields that should change, such as description, name or parent. Anything you leave out keeps its current value.
      - **What you get back:** The updated category with its current values.

      ## Tags

      ### List tags

      Lists the WordPress tags on the site.

      - **Endpoint:** `GET /wp/v2/tags`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, exclude, include, hide empty or post. Use page and per page to work through a long list.
      - **What you get back:** A list of tags, each with fields such as ID, name, slug and link, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a tag

      Creates a new WordPress tag.

      - **Endpoint:** `POST /wp/v2/tags`
      - **What you need to provide:** The fields for the new tag. Name must be supplied. You can also set description.
      - **What you get back:** The created tag, including the ID the site assigned to it.

      ### Get a tag

      Returns the full record for one WordPress tag, found by its tag ID.

      - **Endpoint:** `GET /wp/v2/tags/{id}`
      - **What you need to provide:** The tag ID.
      - **What you get back:** The tag, including ID, name, slug, link and description.

      ### Update a tag

      Changes the data of one existing WordPress tag.

      - **Endpoint:** `POST /wp/v2/tags/{id}`
      - **What you need to provide:** The tag ID, plus only the fields that should change, such as description or name. Anything you leave out keeps its current value.
      - **What you get back:** The updated tag with its current values.

      ## Taxonomies

      ### Get every taxonomy

      Returns the current WordPress taxonomy for this site.

      - **Endpoint:** `GET /wp/v2/taxonomies`
      - **What you need to provide:** Nothing beyond the connection. You can also set type.
      - **What you get back:** The taxonomy, including name, slug, description, capabilities and hierarchical.
      - **Important:** This version reads taxonomies only; it does not change them.

      ### Get a taxonomy

      Returns the full record for one WordPress taxonomy, found by its taxonomy name.

      - **Endpoint:** `GET /wp/v2/taxonomies/{taxonomy}`
      - **What you need to provide:** The taxonomy name.
      - **What you get back:** The taxonomy, including name, slug, description, capabilities and hierarchical.
      - **Important:** This version reads taxonomies only; it does not change them.

  - component_id: wordpress_api_users
    type: markdown
    title: Users
    body: |
      ## Users

      ### List users

      Lists the WordPress users on the site.

      - **Endpoint:** `GET /wp/v2/users`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, exclude, include, slug or roles. Use page and per page to work through a long list.
      - **What you get back:** A list of users, each with fields such as ID, name, slug and link, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Get a user

      Returns the full record for one WordPress user, found by its user ID.

      - **Endpoint:** `GET /wp/v2/users/{id}`
      - **What you need to provide:** The user ID.
      - **What you get back:** The user, including ID, name, slug, link and email.

      ### Get the signed-in user

      Returns the current WordPress user for this site.

      - **Endpoint:** `GET /wp/v2/users/me`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The user, including ID, name, slug, link and email.

  - component_id: wordpress_api_site_settings_and_information
    type: markdown
    title: Site settings and information
    body: |
      ## Setting groups

      ### Get a site setting

      Returns the current WordPress site setting for this site.

      - **Endpoint:** `GET /wp/v2/settings`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The site setting, including title, email, description, URL and timezone.

      ### Update a site setting

      Changes the data of one existing WordPress site setting.

      - **Endpoint:** `POST /wp/v2/settings`
      - **What you need to provide:** The connection, plus only the fields that should change, such as title, description, URL or email. Anything you leave out keeps its current value.
      - **What you get back:** The updated site setting with its current values.

      ## Post types

      ### Get every post type

      Returns the current WordPress post type for this site.

      - **Endpoint:** `GET /wp/v2/types`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The post type, including name, slug, description, capabilities and hierarchical.
      - **Important:** This version reads post types only; it does not change them.

      ### Get a post type

      Returns the full record for one WordPress post type, found by its post type name.

      - **Endpoint:** `GET /wp/v2/types/{type}`
      - **What you need to provide:** The post type name.
      - **What you get back:** The post type, including name, slug, description, capabilities and hierarchical.
      - **Important:** This version reads post types only; it does not change them.

      ## Post statuses

      ### Get every post status

      Returns the current WordPress post status for this site.

      - **Endpoint:** `GET /wp/v2/statuses`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The post status, including name, slug, private, protected and public.
      - **Important:** This version reads post statuses only; it does not change them.

      ### Get a post status

      Returns the full record for one WordPress post status, found by its status name.

      - **Endpoint:** `GET /wp/v2/statuses/{status}`
      - **What you need to provide:** The status name.
      - **What you get back:** The post status, including name, slug, private, protected and public.
      - **Important:** This version reads post statuses only; it does not change them.

      ## Themes

      ### List themes

      Lists the WordPress themes on the site.

      - **Endpoint:** `GET /wp/v2/themes`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by status.
      - **What you get back:** A list of themes, each with fields such as name, status, author and stylesheet, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads themes only; it does not change them.

      ### Get a theme

      Returns the full record for one WordPress theme, found by its theme folder name.

      - **Endpoint:** `GET /wp/v2/themes/{stylesheet}`
      - **What you need to provide:** The theme folder name.
      - **What you get back:** The theme, including name, status, author, stylesheet and description.
      - **Important:** This version reads themes only; it does not change them.

      ## Plugins

      ### List plugins

      Lists the WordPress plugins on the site.

      - **Endpoint:** `GET /wp/v2/plugins`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search or status.
      - **What you get back:** A list of plugins, each with fields such as name, status, author and plugin, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads plugins only; it does not change them.

      ### Get a plugin

      Returns the full record for one WordPress plugin, found by its plugin file.

      - **Endpoint:** `GET /wp/v2/plugins/{plugin}`
      - **What you need to provide:** The plugin file.
      - **What you get back:** The plugin, including name, status, author, plugin and description.
      - **Important:** This version reads plugins only; it does not change them.

      ## Search

      ### Search the site

      Searches published content across the site and returns matching items.

      - **Endpoint:** `GET /wp/v2/search`
      - **What you need to provide:** A search term, and optionally the content types to search and how many results per page.
      - **What you get back:** A list of matches, each with its ID, title, URL and type, plus pagination details.

  - component_id: wordpress_api_blocks_and_patterns
    type: markdown
    title: Blocks and patterns
    body: |
      ## Block types

      ### List block types

      Lists the WordPress block types on the site.

      - **Endpoint:** `GET /wp/v2/block-types`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by namespace.
      - **What you get back:** A list of block types, each with fields such as name, title, description and parent, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads block types only; it does not change them.

      ### List the block types in one namespace

      Lists the WordPress block types on the site.

      - **Endpoint:** `GET /wp/v2/block-types/{namespace}`
      - **What you need to provide:** The block namespace to list block types for.
      - **What you get back:** A list of block types, each with fields such as name, title, description and parent, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads block types only; it does not change them.

      ### Get a block type

      Returns the full record for one WordPress block type, found by its block namespace and block name.

      - **Endpoint:** `GET /wp/v2/block-types/{namespace}/{name}`
      - **What you need to provide:** The block namespace and block name.
      - **What you get back:** The block type, including name, title, description, parent and api version.
      - **Important:** This version reads block types only; it does not change them.

      ## Reusable blocks

      ### List reusable blocks

      Lists the WordPress reusable blocks on the site.

      - **Endpoint:** `GET /wp/v2/blocks`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, after, modified after, before or modified before. Use page and per page to work through a long list.
      - **What you get back:** A list of reusable blocks, each with fields such as ID, title, slug and status, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Create a reusable block

      Creates a new WordPress reusable block.

      - **Endpoint:** `POST /wp/v2/blocks`
      - **What you need to provide:** The fields for the new reusable block. You can also set date, status, title or content.
      - **What you get back:** The created reusable block, including the ID the site assigned to it.

      ### Get a reusable block

      Returns the full record for one WordPress reusable block, found by its block ID.

      - **Endpoint:** `GET /wp/v2/blocks/{id}`
      - **What you need to provide:** The block ID.
      - **What you get back:** The reusable block, including ID, title, slug, status and type.

      ### Update a reusable block

      Changes the data of one existing WordPress reusable block.

      - **Endpoint:** `POST /wp/v2/blocks/{id}`
      - **What you need to provide:** The block ID, plus only the fields that should change, such as date, status, title or content. Anything you leave out keeps its current value.
      - **What you get back:** The updated reusable block with its current values.

      ## Block revisions and autosaves

      ### List block revisions

      Lists the WordPress block revisions on the site.

      - **Endpoint:** `GET /wp/v2/blocks/{parent}/revisions`
      - **What you need to provide:** The block ID to list block revisions for. You can narrow the result by search, exclude or include. Use page and per page to work through a long list.
      - **What you get back:** A list of block revisions, each with fields such as ID, title, slug and date, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.

      ### Get a block revision

      Returns the full record for one WordPress block revision, found by its block ID and revision ID.

      - **Endpoint:** `GET /wp/v2/blocks/{parent}/revisions/{id}`
      - **What you need to provide:** The block ID and revision ID.
      - **What you get back:** The block revision, including ID, title, slug, date and author.

      ### List reusable block autosaves

      Lists the autosaves WordPress has stored for one reusable block.

      - **Endpoint:** `GET /wp/v2/blocks/{id}/autosaves`
      - **What you need to provide:** The block ID.
      - **What you get back:** A list of autosaves for that block, each with its ID, author, date and content.
      - **Important:** This returns the whole set in one response and does not page.

      ### Create a reusable block autosave

      Stores an autosave for one reusable block.

      - **Endpoint:** `POST /wp/v2/blocks/{id}/autosaves`
      - **What you need to provide:** The block ID and the fields to autosave.
      - **What you get back:** The created autosave, including the ID WordPress assigned to it.
      - **Important:** An autosave does not change the saved block.

      ### Get a reusable block autosave

      Returns one stored autosave for a reusable block.

      - **Endpoint:** `GET /wp/v2/blocks/{parent}/autosaves/{id}`
      - **What you need to provide:** The block ID and autosave ID.
      - **What you get back:** The autosave, including its author, date, title and content.

      ## Block directory items

      ### List block directory items

      Lists the WordPress block directory items on the site.

      - **Endpoint:** `GET /wp/v2/block-directory/search`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by term. Use page and per page to work through a long list.
      - **What you get back:** A list of block directory items, each with fields such as ID, name, title and author, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This version reads block directory items only; it does not change them.

      ## Block patterns

      ### List block patterns

      Lists the WordPress block patterns on the site.

      - **Endpoint:** `GET /wp/v2/block-patterns/patterns`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of block patterns, each with fields such as name, title, content and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads block patterns only; it does not change them.

      ## Block pattern categories

      ### List block pattern categories

      Lists the WordPress block pattern categories on the site.

      - **Endpoint:** `GET /wp/v2/block-patterns/categories`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of block pattern categories, each with fields such as name, description and label, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads block pattern categories only; it does not change them.

      ## Pattern directory items

      ### List pattern directory items

      Lists the WordPress pattern directory items on the site.

      - **Endpoint:** `GET /wp/v2/pattern-directory/patterns`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by search, category, keyword or slug. Use page and per page to work through a long list.
      - **What you get back:** A list of pattern directory items, each with fields such as ID, title, content and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This version reads pattern directory items only; it does not change them.

      ## Rendered blocks

      ### Render a block

      Asks WordPress to render one block and return its HTML.

      - **Endpoint:** `POST /wp/v2/block-renderer/{name}`
      - **What you need to provide:** The block name, such as core/paragraph, and the block attributes to render it with.
      - **What you get back:** The rendered HTML for that block.
      - **Important:** This only renders. Nothing is saved to the site.

  - component_id: wordpress_api_menus_sidebars_and_widgets
    type: markdown
    title: Menus, sidebars and widgets
    body: |
      ## Menu locations

      ### Get every menu location

      Returns the current WordPress menu location for this site.

      - **Endpoint:** `GET /wp/v2/menu-locations`
      - **What you need to provide:** Nothing beyond the connection.
      - **What you get back:** The menu location, including name, description and menu.
      - **Important:** This version reads menu locations only; it does not change them.

      ### Get a menu location

      Returns the full record for one WordPress menu location, found by its location name.

      - **Endpoint:** `GET /wp/v2/menu-locations/{location}`
      - **What you need to provide:** The location name.
      - **What you get back:** The menu location, including name, description and menu.
      - **Important:** This version reads menu locations only; it does not change them.

      ## Sidebars

      ### List sidebars

      Lists the WordPress sidebars on the site.

      - **Endpoint:** `GET /wp/v2/sidebars`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of sidebars, each with fields such as ID, name, status and description, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Get a sidebar

      Returns the full record for one WordPress sidebar, found by its sidebar ID.

      - **Endpoint:** `GET /wp/v2/sidebars/{id}`
      - **What you need to provide:** The sidebar ID.
      - **What you get back:** The sidebar, including ID, name, status, description and class.

      ### Update a sidebar

      Changes the data of one existing WordPress sidebar.

      - **Endpoint:** `POST /wp/v2/sidebars/{id}`
      - **What you need to provide:** The sidebar ID, plus only the fields that should change, such as widgets. Anything you leave out keeps its current value.
      - **What you get back:** The updated sidebar with its current values.

      ## Widget types

      ### List widget types

      Lists the WordPress widget types on the site.

      - **Endpoint:** `GET /wp/v2/widget-types`
      - **What you need to provide:** Nothing is required beyond the connection.
      - **What you get back:** A list of widget types, each with fields such as ID, name, description and is multi, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page. This version reads widget types only; it does not change them.

      ### Get a widget type

      Returns the full record for one WordPress widget type, found by its widget type ID.

      - **Endpoint:** `GET /wp/v2/widget-types/{id}`
      - **What you need to provide:** The widget type ID.
      - **What you get back:** The widget type, including ID, name, description, is multi and classname.
      - **Important:** This version reads widget types only; it does not change them.

      ## Widgets

      ### List widgets

      Lists the WordPress widgets on the site.

      - **Endpoint:** `GET /wp/v2/widgets`
      - **What you need to provide:** Nothing is required beyond the connection. You can narrow the result by sidebar.
      - **What you get back:** A list of widgets, each with fields such as ID, id base, sidebar and rendered, together with pagination details: the total number of items, the total number of pages, and links to the next and previous pages.
      - **Important:** This endpoint returns the whole set in one response and does not page.

      ### Create a widget

      Creates a new WordPress widget.

      - **Endpoint:** `POST /wp/v2/widgets`
      - **What you need to provide:** The fields for the new widget. Sidebar must be supplied. You can also set id base, instance or form data.
      - **What you get back:** The created widget, including the ID the site assigned to it.

      ### Get a widget

      Returns the full record for one WordPress widget, found by its widget ID.

      - **Endpoint:** `GET /wp/v2/widgets/{id}`
      - **What you need to provide:** The widget ID.
      - **What you get back:** The widget, including ID, id base, sidebar, rendered and rendered form.

      ### Update a widget

      Changes the data of one existing WordPress widget.

      - **Endpoint:** `POST /wp/v2/widgets/{id}`
      - **What you need to provide:** The widget ID, plus only the fields that should change, such as id base, sidebar, instance or form data. Anything you leave out keeps its current value.
      - **What you get back:** The updated widget with its current values.

  - component_id: wordpress_api_unavailable
    type: markdown
    title: Not available in this version
    body: |
      These are excluded by design, not missing by accident. The technical inventory with one row per route is in `contracts/rest_coverage.yaml`.

      ### Creating or changing user accounts

      Creating or changing a WordPress user account is account administration rather than content automation, and a mistake in a workflow can lock somebody out of the site or hand them more access than intended. Users can be read; create and change them in the site's admin.

      Affects: `POST /wp/v2/users`, `POST /wp/v2/users/{id}`, `POST /wp/v2/users/me`.

      ### Deleting records

      Deleting is unavailable in version 1.0.0 because this extension excludes destructive operations. Read, create and update the record instead, or delete it in the site's admin.

      Affects: `DELETE /wp/v2/posts/{id}`, `DELETE /wp/v2/posts/{parent}/revisions/{id}`, `DELETE /wp/v2/pages/{id}`, `DELETE /wp/v2/pages/{parent}/revisions/{id}`, `DELETE /wp/v2/media/{id}`, `DELETE /wp/v2/comments/{id}`, `DELETE /wp/v2/categories/{id}`, `DELETE /wp/v2/tags/{id}`, `DELETE /wp/v2/users/{id}`, `DELETE /wp/v2/users/me`, `DELETE /wp/v2/blocks/{id}`, `DELETE /wp/v2/blocks/{parent}/revisions/{id}`, `DELETE /wp/v2/widgets/{id}`.

      ### Installing or changing plugins

      Installing, updating, activating, deactivating and deleting plugins is unavailable because it changes the code the site runs. Plugins can be listed and read.

      Affects: `POST /wp/v2/plugins`, `POST /wp/v2/plugins/{plugin}`, `DELETE /wp/v2/plugins/{plugin}`.

      ### Installing or changing themes

      WordPress Core publishes no documented write endpoint for themes, and version 1.0.0 does not add one. Themes can be listed and read.

      Affects: Themes.

      ### Managing Application Passwords

      Managing Application Passwords is unavailable because this extension signs in with one. Create, rotate and revoke them yourself in WordPress under Users then Profile.

      Affects: `GET /wp/v2/users/{user_id}/application-passwords`, `POST /wp/v2/users/{user_id}/application-passwords`, `DELETE /wp/v2/users/{user_id}/application-passwords`, `GET /wp/v2/users/{user_id}/application-passwords/introspect`, `GET /wp/v2/users/{user_id}/application-passwords/{uuid}`, `POST /wp/v2/users/{user_id}/application-passwords/{uuid}`, `DELETE /wp/v2/users/{user_id}/application-passwords/{uuid}`.

      ### Routes outside the covered namespaces

      This route lives outside the /wp/v2 namespace that version 1.0.0 covers.

      Affects: `GET /wp-site-health/v1/tests/background-updates`, `GET /wp-site-health/v1/tests/loopback-requests`, `GET /wp-site-health/v1/tests/https-status`, `GET /wp-site-health/v1/tests/dotorg-communication`, `GET /wp-site-health/v1/tests/authorization-header`, `POST /batch/v1`.

      ### Resources with no official reference page

      WordPress Core ships this, but publishes no official REST reference page for it. Version 1.0.0 does not guess at an undocumented contract.

      Affects: Global_styles, Global_styles_revisions, Navigation, Navigation_revisions, Menus, Menu_items, Templates, Template_revisions, Template_parts, Template_part_revisions.
