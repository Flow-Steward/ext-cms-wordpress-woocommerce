runtime:
  extension_contract_v2:
    connection_types: contracts/connection_types.yaml
    operation_manifest: contracts/operation_manifest.yaml
    step_ui_manifest: contracts/step_ui_manifest.yaml
    artifact_policies: contracts/artifact_policies.yaml
artifact_policies:
  - {operation_id: wp_create_media, inputs: [{kind: artifact, value_type: artifact_handle, binding_key: wordpress_media_artifact, from_input: artifact_handle, max_size_bytes: 67108864}]}
  - operation_id: wc_export_products
    outputs:
      - {kind: artifact, value_type: artifact_handle, binding_key: woocommerce_products_export, filename: woocommerce-products.jsonl, content_type: application/x-ndjson, max_size_bytes: 209715200, max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES, retention_class: run_window}
entrypoint:
  mode: subprocess
  command: [python3, main.py]
  timeout_policy: {env: FS_EXTENSION_OPERATION_TIMEOUT_SECONDS, default_seconds: 300, minimum_seconds: 30, maximum_seconds: 3600, headroom_seconds: 30}
health: {command: [python3, health.py], timeout_seconds: 5}
ui_manifest: ui/ui_manifest.yaml
action_manifest: ui/actions/actions.yaml
python_requirements: []
