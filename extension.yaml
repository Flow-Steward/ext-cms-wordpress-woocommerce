manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.wordpress-woocommerce
kind: tool_provider
version: 1.0.0
release_stage: active
billing_mode: free
display_name: WordPress & WooCommerce
description: A curated, automation-safe subset of the WordPress Core and WooCommerce REST APIs, typed and scoped to one project-scoped WordPress site.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-cms-wordpress-woocommerce/issues
  website_url: https://github.com/Flow-Steward/ext-cms-wordpress-woocommerce
listing:
  category: cms
  tags: [wordpress, woocommerce, rest, cms, ecommerce]
  summary: Read and safely write standard WordPress and WooCommerce data over the official REST APIs.
features: [tool, action]
required_scopes: [extension:invoke, artifact:read, artifact:write]
account_scope:
  scope_type: project
  description: Each WordPress site connection, its Application Password, and its optional WooCommerce keys are scoped to one project.
external_effects:
  - {operation_id: wp_create_post, effect_kind: wordpress_posts_create, channel: wordpress_rest, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: wp_update_post, effect_kind: wordpress_posts_update, channel: wordpress_rest, idempotency: required, test_mode_behavior: suppress}
  - {operation_id: wp_create_post_autosave, effect_kind: wordpress_post_revisions_create, channel: wordpress_rest, idempotency: required, test_mode_behavior: suppress}
